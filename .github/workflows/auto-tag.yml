name: Auto Tag on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  create-tag-and-release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feat/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from branch name
        id: version
        run: echo "version=${GITHUB_HEAD_REF#feat/}" >> $GITHUB_OUTPUT
      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
      - name: Trigger release workflow
        run: gh workflow run release.yml --ref ${{ steps.version.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
