name: Auto Tag on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-tag-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  create-tag-and-release:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'feat/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Extract and validate version from branch name
        id: version
        run: |
          version="${GITHUB_HEAD_REF#feat/}"
          if [[ ! "$version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release branches must be named feat/<version>."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"
      - name: Create GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
      # Tags pushed with GITHUB_TOKEN do not trigger another push workflow.
      - name: Trigger release workflow
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "$VERSION"
