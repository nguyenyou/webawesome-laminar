name: Release

on:
  workflow_dispatch:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != tag || ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Select a semantic version tag to publish a release."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test generated bindings
        run: bun test scripts/generate.test.ts
      - name: Compile library
        run: ./mill --no-server webawesome-laminar.compile
      # Regeneration changes tracked files and would add DIRTY to the published version.
      - name: Verify clean release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git diff --exit-code
          ./mill --no-server show webawesome-laminar.publishVersion > "$RUNNER_TEMP/publish-version.json"
          bun -e 'const version = await Bun.file(process.env.RUNNER_TEMP + "/publish-version.json").json(); const expected = process.env.RELEASE_TAG.replace(/^v/, ""); if (version !== expected) { throw new Error("Expected " + expected + ", got " + version); }'
      - name: Publish to Maven Central
        run: ./mill --no-server webawesome-laminar.publishSonatypeCentral
        env:
          MILL_SONATYPE_USERNAME: ${{ secrets.MILL_SONATYPE_USERNAME }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.MILL_SONATYPE_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.MILL_PGP_SECRET_BASE64 }}
          MILL_PGP_PASSPHRASE: ${{ secrets.MILL_PGP_PASSPHRASE }}
