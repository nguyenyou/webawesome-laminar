name: Vercel Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

jobs:
  deploy-to-vercel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Cache Mill and Coursier downloads
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/mill/download
            ~/.cache/coursier
          key: ${{ runner.os }}-mill-${{ hashFiles('.mill-version', '**/*.mill') }}
          restore-keys: ${{ runner.os }}-mill-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test generated bindings
        run: bun test scripts/generate.test.ts
      - name: Generate documentation examples
        run: bun run generate:docs
      - name: Compile and link all Scala.js modules
        run: ./mill --no-server __.fullLinkJS
      - name: Bundle documentation previews
        run: bun docs/build.ts
      - name: Pull Vercel production configuration
        run: bunx --bun vercel@64.0.1 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Build Vercel artifacts
        run: bunx --bun vercel@64.0.1 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy Vercel artifacts
        run: bunx --bun vercel@64.0.1 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
