name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Cache Mill and Coursier downloads
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/mill/download
            ~/.cache/coursier
          key: ${{ runner.os }}-mill-${{ hashFiles('.mill-version', '**/*.mill') }}
          restore-keys: ${{ runner.os }}-mill-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate binding generation
        run: bun scripts/generate.ts --force --validate
      - name: Test generated bindings
        run: bun test scripts/generate.test.ts
      - name: Generate documentation examples
        run: bun run generate:docs
      - name: Compile and link all Scala.js modules
        run: ./mill --no-server __.fullLinkJS
      - name: Bundle documentation previews
        run: bun docs/build.ts
      - name: Build documentation site
        working-directory: docs
        run: bun --bun run build
