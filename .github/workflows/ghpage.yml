name: GitHub Pages Redirect

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: read
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Build redirect to the documentation site
        run: |
          mkdir -p pages
          cat > pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta http-equiv="refresh" content="0; url=https://webawesome-laminar.vercel.app/">
              <link rel="canonical" href="https://webawesome-laminar.vercel.app/">
              <title>Documentation has moved</title>
            </head>
            <body>
              <p><a href="https://webawesome-laminar.vercel.app/">Open the documentation</a></p>
            </body>
          </html>
          HTML
          cp pages/index.html pages/404.html
          touch pages/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: pages
  # Deploy job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment.
    permissions:
      pages: write
      id-token: write
    # Deploy to the github-pages environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
